# EKB M1 脱敏评估集
# 版本: v1（首版基线）
# 标注人: QA
# 标注日期: 2026-08-07
# 适用知识版本: seed-v1（5 篇脱敏运维 SOP，12 个 chunk）
# 用途: 准确率、引用正确率、拒答率、幻觉率基线测量
#
# 规模说明:
#   Spec 建议 M1 Golden ≥100 题、No-answer ≥30 题。
#   本版评估集为 Golden 100 题、No-answer 30 题，覆盖 seed-v1 全部 12 个 chunk
#   及主要拒答场景。问题类型包含单文档事实题、多角度追问题和跨 SOP 综合题。
#
# 评估口径（与 RAG评估与数据治理方案 §7 一致）:
#   首答准确率 = 正确且有证据的首轮回答数 / 有答案题总数
#   引用正确率 = 支持结论的引用数 / 展示引用总数
#   拒答率 = 正确拒答数 / 应拒答题总数
#   幻觉率 = 编造或引用不支持结论的回答数 / 总回答数

version: "v2"
knowledge_version: "seed-v2"
annotator: "QA"
annotated_at: "2026-08-07"

