[project]
name = "ekb-api"
version = "0.1.0"
description = "EKB FastAPI tracer bullet"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<0.129",
  "python-multipart>=0.0.18",
  "uvicorn[standard]>=0.30,<0.40",
  "sqlalchemy>=2.0,<3",
  "pypdf>=4.0,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=0.6,<2",
  "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "pyyaml>=6.0,<7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP045"]
