      - paragraph [ref=f1e277]: 这份 v5 设计稿吸收开源知识库/RAG 产品的可用模式，但落点保持在 EKB 现有的四页架构：问答、知识库、检索、运营。重点不是增加炫技入口，而是把“可信答案”拆成可检索、可审计、可治理的界面对象。
      - generic [ref=f1e278]:
        - article [ref=f1e279]:
          - strong [ref=f1e280]: Dify
          - generic [ref=f1e281]: 知识管道、数据源接入、测试与监控启发了检索设置、数据源连接和质量门禁。
        - article [ref=f1e282]:
          - strong [ref=f1e283]: RAGFlow
          - generic [ref=f1e284]: 分块可视化、引用追踪和混合检索启发了右侧证据检查器与检索链路。
        - article [ref=f1e285]:
          - strong [ref=f1e286]: MaxKB
          - generic [ref=f1e287]: 开箱即用的问答与嵌入场景启发了左侧 KB 选择、会话和快速问答。
        - article [ref=f1e288]:
          - strong [ref=f1e289]: AnythingLLM
          - generic [ref=f1e290]: Workspace + 文档拖拽 + 来源引用启发了低摩擦提问区和文档清单。
        - article [ref=f1e291]:
          - strong [ref=f1e292]: Open WebUI
          - generic [ref=f1e293]: 知识集合、检索模式、目录同步和 API/导出启发了检索过滤与资产同步状态。
